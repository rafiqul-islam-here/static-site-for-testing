name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  APP_NAME: ${{ vars.APP_NAME }}
  NETBIRD_SETUP_KEY: ${{ vars.NETBIRD_SETUP_KEY }}
  REGISTRY_PORT: ${{ vars.REGISTRY_PORT }}
  VPS_NETBIRD_IP: ${{ vars.VPS_NETBIRD_IP }}

jobs:
  validate-branch:
    name: Validate Branch
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          echo "Branch: $BRANCH"

          case "$BRANCH" in
            main|dev)
              echo "Branch validation successful."
              ;;
            *)
              echo "Invalid branch: $BRANCH"
              exit 1
              ;;
          esac

  build-push-deploy:
    name: Build Push Deploy
    needs: validate-branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Install NetBird
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          netbird version

      - name: Connect to NetBird
        run: |
          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY"

          echo "Waiting for NetBird connection..."

          for i in {1..30}; do
            STATUS=$(sudo netbird status 2>/dev/null || true)

            if echo "$STATUS" | grep -qi "Connected"; then
              echo "NetBird connected successfully."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Failed to connect to NetBird."
              exit 1
            fi

            sleep 2
          done

          sudo netbird status

      - name: Configure Deployment
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          case "$BRANCH" in
            main)
              echo "NOMAD_NAMESPACE=prod" >> "$GITHUB_ENV"
              echo "FRONTEND_JOB_FILE=nomad/prod/frontend.hcl" >> "$GITHUB_ENV"
              echo "NGINX_JOB_FILE=nomad/nginx-prod.hcl" >> "$GITHUB_ENV"
              echo "NGINX_IMAGE=${VPS_NETBIRD_IP}:${REGISTRY_PORT}/nginx-prod:latest" >> "$GITHUB_ENV"
              echo "Deployment target: prod"
              ;;
            dev)
              echo "NOMAD_NAMESPACE=dev" >> "$GITHUB_ENV"
              echo "FRONTEND_JOB_FILE=nomad/dev/frontend.hcl" >> "$GITHUB_ENV"
              echo "NGINX_JOB_FILE=nomad/nginx-dev.hcl" >> "$GITHUB_ENV"
              echo "NGINX_IMAGE=${VPS_NETBIRD_IP}:${REGISTRY_PORT}/nginx-dev:latest" >> "$GITHUB_ENV"
              echo "Deployment target: dev"
              ;;
            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

      - name: Test Registry Connection
        run: |
          echo "=== NetBird Status ==="
          sudo netbird status

          echo
          echo "=== Test VPS ==="
          ping -c 3 "$VPS_NETBIRD_IP" || true

          echo
          echo "=== Test Registry ==="
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$VPS_NETBIRD_IP/$REGISTRY_PORT" && echo "Registry TCP connection successful." || exit 1

          curl -v --connect-timeout 10 "http://${VPS_NETBIRD_IP}:${REGISTRY_PORT}/v2/"

      - name: Generate Frontend Image Tag
        run: |
          TAG="${GITHUB_RUN_NUMBER}"
          REGISTRY="${VPS_NETBIRD_IP}:${REGISTRY_PORT}"
          IMAGE="${REGISTRY}/${APP_NAME}:${TAG}"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "Application: $APP_NAME"
          echo "Tag: $TAG"
          echo "Image: $IMAGE"

      - name: Build Frontend Image
        run: |
          podman build \
            -t "$IMAGE" \
            ./front-end

          echo "Frontend image built successfully."

      - name: Push Frontend Image
        run: |
          podman push \
            --tls-verify=false \
            "$IMAGE"

          echo "Frontend image pushed successfully."
          echo "Image: $IMAGE"

      - name: Build Nginx Image
        run: |
          podman build \
            -t "$NGINX_IMAGE" \
            "nginx/${NOMAD_NAMESPACE}"

          echo "Nginx image built successfully."
          echo "Image: $NGINX_IMAGE"

      - name: Push Nginx Image
        run: |
          podman push \
            --tls-verify=false \
            "$NGINX_IMAGE"

          echo "Nginx image pushed successfully."
          echo "Image: $NGINX_IMAGE"

      - name: Install Nomad
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update
          sudo apt-get install -y nomad

          nomad version

      - name: Test Nomad Connection
        env:
          NOMAD_ADDR: http://${{ vars.VPS_NETBIRD_IP }}:4646
        run: |
          nomad server members
          nomad node status

      - name: Deploy Nginx
        env:
          NOMAD_ADDR: http://${{ vars.VPS_NETBIRD_IP }}:4646
        run: |
          nomad job run \
            -namespace="$NOMAD_NAMESPACE" \
            -var="IMAGE=${NGINX_IMAGE}" \
            "$NGINX_JOB_FILE"

      - name: Deploy Frontend
        env:
          NOMAD_ADDR: http://${{ vars.VPS_NETBIRD_IP }}:4646
        run: |
          nomad job run \
            -namespace="$NOMAD_NAMESPACE" \
            -var="IMAGE=${IMAGE}" \
            "$FRONTEND_JOB_FILE"

      - name: Verify Nginx Deployment
        env:
          NOMAD_ADDR: http://${{ vars.VPS_NETBIRD_IP }}:4646
        run: |
          sleep 10

          nomad job status \
            -namespace="$NOMAD_NAMESPACE" \
            nginx

          nomad job allocs \
            -namespace="$NOMAD_NAMESPACE" \
            nginx

      - name: Verify Frontend Deployment
        env:
          NOMAD_ADDR: http://${{ vars.VPS_NETBIRD_IP }}:4646
        run: |
          nomad job status \
            -namespace="$NOMAD_NAMESPACE" \
            frontend

          nomad job allocs \
            -namespace="$NOMAD_NAMESPACE" \
            frontend

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${IMAGE:-}" ]; then
            podman rmi "$IMAGE" 2>/dev/null || true
          fi

          if [ -n "${NGINX_IMAGE:-}" ]; then
            podman rmi "$NGINX_IMAGE" 2>/dev/null || true
          fi

          sudo netbird down || true

          echo "Cleanup completed."

