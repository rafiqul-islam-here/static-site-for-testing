name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:

env:
  APP_NAME: ${{ vars.APP_NAME }}
  NETBIRD_SETUP_KEY: ${{ vars.NETBIRD_SETUP_KEY }}
  REGISTRY_PORT: ${{ vars.REGISTRY_PORT }}
  VPS_NETBIRD_IP: ${{ vars.VPS_NETBIRD_IP }}

jobs:
  validate-branch:
    name: Validate Branch
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          case "$BRANCH" in
            main|dev)
              echo "Branch validation successful: $BRANCH"
              ;;
            *)
              echo "Invalid branch: $BRANCH"
              exit 1
              ;;
          esac

  build-and-deploy:
    name: Build and Deploy
    needs: validate-branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Install Nomad
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y nomad
          nomad version

      - name: Install NetBird
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          netbird version

      - name: Connect to NetBird
        run: |
          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY"

          echo "Waiting for NetBird connection..."

          for i in {1..30}; do
            STATUS=$(sudo netbird status 2>/dev/null || true)

            if echo "$STATUS" | grep -qi "Connected"; then
              echo "NetBird connected successfully."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Failed to connect to NetBird."
              exit 1
            fi

            sleep 2
          done

          sudo netbird status

      - name: Test VPS Connectivity
        run: |
          ping -c 3 "$VPS_NETBIRD_IP"

          timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/$VPS_NETBIRD_IP/$REGISTRY_PORT"

          curl --connect-timeout 10 \
            "http://${VPS_NETBIRD_IP}:${REGISTRY_PORT}/v2/"

      - name: Set Deployment Variables
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TAG="${GITHUB_RUN_NUMBER}"
          REGISTRY="${VPS_NETBIRD_IP}:${REGISTRY_PORT}"

          if [ "$BRANCH" = "main" ]; then
            NAMESPACE="prod"
            FRONTEND_JOB="nomad/prod/frontend.hcl"
            NGINX_JOB="nomad/nginx-prod.hcl"
            NGINX_IMAGE="${REGISTRY}/nginx-prod:${TAG}"
          else
            NAMESPACE="dev"
            FRONTEND_JOB="nomad/dev/frontend.hcl"
            NGINX_JOB="nomad/nginx-dev.hcl"
            NGINX_IMAGE="${REGISTRY}/nginx-dev:${TAG}"
          fi

          FRONTEND_IMAGE="${REGISTRY}/${APP_NAME}:${TAG}"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$GITHUB_ENV"
          echo "NGINX_IMAGE=$NGINX_IMAGE" >> "$GITHUB_ENV"
          echo "FRONTEND_JOB=$FRONTEND_JOB" >> "$GITHUB_ENV"
          echo "NGINX_JOB=$NGINX_JOB" >> "$GITHUB_ENV"

      - name: Build Frontend Image
        run: |
          podman build \
            -t "$FRONTEND_IMAGE" \
            ./front-end

      - name: Push Frontend Image
        run: |
          podman push \
            --tls-verify=false \
            "$FRONTEND_IMAGE"

      - name: Build Nginx Image
        run: |
          if [ "$NAMESPACE" = "prod" ]; then
            NGINX_CONTEXT="./nginx/prod"
          else
            NGINX_CONTEXT="./nginx/dev"
          fi

          podman build \
            -t "$NGINX_IMAGE" \
            -f "$NGINX_CONTEXT/Containerfile" \
            "$NGINX_CONTEXT"

      - name: Push Nginx Image
        run: |
          podman push \
            --tls-verify=false \
            "$NGINX_IMAGE"

      - name: Configure Nomad
        run: |
          export NOMAD_ADDR="http://${VPS_NETBIRD_IP}:4646"

          echo "NOMAD_ADDR=$NOMAD_ADDR" >> "$GITHUB_ENV"

      - name: Validate Frontend Job
        run: |
          nomad job validate \
            "$FRONTEND_JOB"

      - name: Validate Nginx Job
        run: |
          nomad job validate \
            "$NGINX_JOB"

      - name: Deploy Frontend
        run: |
          nomad job run \
            -namespace="$NAMESPACE" \
            -var="IMAGE=${FRONTEND_IMAGE}" \
            "$FRONTEND_JOB"

      - name: Deploy Nginx
        run: |
          nomad job run \
            -namespace="$NAMESPACE" \
            -var="IMAGE=${NGINX_IMAGE}" \
            "$NGINX_JOB"

      - name: Verify Frontend Deployment
        run: |
          sleep 10
          nomad job status \
            -namespace="$NAMESPACE" \
            frontend

      - name: Verify Nginx Deployment
        run: |
          nomad job status \
            -namespace="$NAMESPACE" \
            nginx

      - name: Show Allocations
        run: |
          echo "=== Frontend Allocations ==="
          nomad job allocs \
            -namespace="$NAMESPACE" \
            frontend

          echo
          echo "=== Nginx Allocations ==="
          nomad job allocs \
            -namespace="$NAMESPACE" \
            nginx

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${FRONTEND_IMAGE:-}" ]; then
            podman rmi "$FRONTEND_IMAGE" 2>/dev/null || true
          fi

          if [ -n "${NGINX_IMAGE:-}" ]; then
            podman rmi "$NGINX_IMAGE" 2>/dev/null || true
          fi

          sudo netbird down || true