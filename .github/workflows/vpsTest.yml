name: Build and Push Image

on:
  push:
    branches:
      - main
      - dev
      - staging

  workflow_dispatch:

env:
  APP_NAME: ${{ vars.APP_NAME }}
  NETBIRD_SETUP_KEY: ${{ vars.NETBIRD_SETUP_KEY }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ vars.REGISTRY_PASSWORD }}
  REGISTRY_PORT: ${{ vars.REGISTRY_PORT }}
  VPS_NETBIRD_IP: ${{ vars.VPS_NETBIRD_IP }}

jobs:
  validate-branch:
    name: Validate Branch
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          echo "Branch: $BRANCH"

          case "$BRANCH" in
            main|dev|staging)
              echo "Branch validation successful."
              ;;
            *)
              echo "Invalid branch: $BRANCH"
              exit 1
              ;;
          esac

  build-and-push:
    name: Build & Push
    needs: validate-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Connect to NetBird
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          netbird version
          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY"
          echo "Waiting for NetBird connection..."

          for i in {1..30}; do
            STATUS=$(sudo netbird status 2>/dev/null || true)
            if echo "$STATUS" | grep -qi "Connected"; then
              echo "NetBird connected successfully."
              break
            fi
            sleep 2
          done

          sudo netbird status

      - name: Test Registry Connection
        run: |
          echo "Testing registry..."
          curl --fail --connect-timeout 10 "http://${VPS_NETBIRD_IP}:${REGISTRY_PORT}/v2/"
          echo "Registry is reachable."

      - name: Generate Image Tag
        run: |
          TAG="${GITHUB_RUN_NUMBER}"
          IMAGE="${VPS_NETBIRD_IP}:${REGISTRY_PORT}/${APP_NAME}:${TAG}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Application : $APP_NAME"
          echo "Tag         : $TAG"
          echo "Image       : $IMAGE"

      - name: Build Image
        run: |
          podman build -t "$IMAGE" ./front-end
          echo "Image built successfully."

      - name: Login to Registry
        run: |
          podman login "${VPS_NETBIRD_IP}:${REGISTRY_PORT}" --username "$REGISTRY_USERNAME" --password "$REGISTRY_PASSWORD"

      - name: Push Image
        run: |
          podman push "$IMAGE"
          echo "Image pushed successfully"
          echo "Image: $IMAGE"

      - name: Cleanup
        if: always()
        run: |
          podman logout "${VPS_NETBIRD_IP}:${REGISTRY_PORT}" || true
          sudo netbird down || true
